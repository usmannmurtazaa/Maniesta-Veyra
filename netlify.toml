[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_APP_NAME,NEXT_PUBLIC_APP_TAGLINE,NEXT_PUBLIC_PORTFOLIO_URL,NEXT_PUBLIC_CURRENCY,NEXT_PUBLIC_CURRENCY_SYMBOL,NEXT_PUBLIC_GA_ID,NEXT_PUBLIC_VERCEL_ANALYTICS_ID,AUTH_URL"
  SECRETS_SCAN_OMIT_PATHS = "README.md,.env.example,tests/**,playwright.config.ts,lighthouserc.js,src/lib/env.ts"

[[plugins]]
  package = "@netlify/plugin-nextjs"